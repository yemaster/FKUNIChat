name: Electron Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
      - "v*.*.*-alpha*"
      - "v*.*.*-beta*"

permissions:
  contents: write

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            build_args: --win nsis --x64
            artifact_name: FKUNIChat-windows-x64
            system_name: windows
            arch_name: x64
            package_extensions: exe
          - name: windows-arm64
            runner: windows-latest
            build_args: --win nsis --arm64
            artifact_name: FKUNIChat-windows-arm64
            system_name: windows
            arch_name: arm64
            package_extensions: exe
          - name: linux-x64
            runner: ubuntu-latest
            build_args: --linux AppImage deb --x64
            artifact_name: FKUNIChat-linux-x64
            system_name: linux
            arch_name: x64
            package_extensions: AppImage,deb
          - name: linux-arm64
            runner: ubuntu-latest
            build_args: --linux AppImage deb --arm64
            artifact_name: FKUNIChat-linux-arm64
            system_name: linux
            arch_name: arm64
            package_extensions: AppImage,deb
          - name: macos-arm64
            runner: macos-14
            build_args: --mac dmg zip --arm64
            artifact_name: FKUNIChat-macos-arm64
            system_name: macos
            arch_name: arm64
            package_extensions: dmg

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Normalize installer names
        run: node scripts/rename-release-packages.mjs
        env:
          PACKAGE_SYSTEM: ${{ matrix.system_name }}
          PACKAGE_ARCH: ${{ matrix.arch_name }}
          PACKAGE_EXTENSIONS: ${{ matrix.package_extensions }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*-${{ matrix.system_name }}-${{ matrix.arch_name }}.exe
            release/*-${{ matrix.system_name }}-${{ matrix.arch_name }}.dmg
            release/*-${{ matrix.system_name }}-${{ matrix.arch_name }}.AppImage
            release/*-${{ matrix.system_name }}-${{ matrix.arch_name }}.deb
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FKUNIChat-*
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FKUNIChat ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
