name: Electron Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
      - "v*.*.*-alpha*"
      - "v*.*.*-beta*"

permissions:
  contents: write

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            build_args: --win nsis --x64
            artifact_name: FKUNIChat-windows-x64
          - name: windows-arm64
            runner: windows-latest
            build_args: --win nsis --arm64
            artifact_name: FKUNIChat-windows-arm64
          - name: linux-x64
            runner: ubuntu-latest
            build_args: --linux AppImage deb --x64
            artifact_name: FKUNIChat-linux-x64
          - name: linux-arm64
            runner: ubuntu-latest
            build_args: --linux AppImage deb --arm64
            artifact_name: FKUNIChat-linux-arm64
          - name: macos-arm64
            runner: macos-14
            build_args: --mac dmg zip --arm64
            artifact_name: FKUNIChat-macos-arm64

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FKUNIChat-*
          path: release-artifacts

      - name: Normalize Windows update metadata names
        run: |
          if [ -f "release-artifacts/FKUNIChat-windows-arm64/latest.yml" ]; then
            mv "release-artifacts/FKUNIChat-windows-arm64/latest.yml" "release-artifacts/FKUNIChat-windows-arm64/latest-arm64.yml"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FKUNIChat ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.blockmap
            release-artifacts/**/latest*.yml
